name: Distributions
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: Create artifact fixtures
        run: |
          mkdir fixtures
          printf 'wheel fixture\n' > fixtures/wheel.txt
          printf 'source fixture\n' > fixtures/source.txt
      - uses: actions/upload-artifact@v7
        with:
          name: roundtrip-wheel
          path: fixtures/wheel.txt
      - uses: actions/upload-artifact@v7
        with:
          name: roundtrip-source
          path: fixtures/source.txt
      - uses: actions/download-artifact@v8
        with:
          name: roundtrip-source
          path: by-name
      - uses: actions/download-artifact@v8
        with:
          pattern: roundtrip-*
          path: merged
          merge-multiple: true
      - name: Verify named and merged downloads
        run: |
          cmp fixtures/source.txt by-name/source.txt
          cmp fixtures/source.txt merged/source.txt
          cmp fixtures/wheel.txt merged/wheel.txt
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check --strict dist/*
      - name: Build and test from the source archive
        shell: bash
        run: |
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/wheel_smoke.py"
      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
  verify-distributions:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: source-distribution
          path: dist
      - run: python -m pip install twine
      - name: Check the downloaded release artifacts
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 15, f'Expected 15 wheels, found {len(wheels)}'
          for platform in ('manylinux', 'macosx'):
              assert any(platform in p.name for p in wheels), platform
          assert len(list(Path('dist').glob('*.tar.gz'))) == 1
          PYTHON
          python -m twine check --strict dist/*
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-distributions, artifact-roundtrip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os, tomllib
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PYTHON
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: source-distribution
          path: dist
      - run: python -m pip install twine
      - run: python -m twine check --strict dist/*
      - name: Create draft GitHub release for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "FlashJet $RELEASE_TAG" --notes-file CHANGELOG.md
