[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashjet"
version = "0.1.0"
description = "Batched jet clustering with NumPy, C++, PyTorch, and Triton backends"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  {name = "Sitian Qian", email = "sitian.qian@cern.ch"},
  {name = "Chirayu Gupta"},
  {name = "Alexandre De Moor"},
  {name = "OpenAI Codex (AI co-author)"},
  {name = "Anthropic Claude (AI co-author)"},
]
keywords = ["jets", "particle-physics", "triton", "pytorch", "clustering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/jet-universe/FlashJet"
Documentation = "https://jet-universe.github.io/FlashJet/"
Source = "https://github.com/jet-universe/FlashJet"
Issues = "https://github.com/jet-universe/FlashJet/issues"
Changelog = "https://github.com/jet-universe/FlashJet/blob/main/CHANGELOG.md"

[project.optional-dependencies]
torch = ["torch>=2.0"]
triton = ["torch>=2.0", "triton>=2.1; sys_platform == 'linux' and platform_machine == 'x86_64'"]
data = ["torch>=2.0", "awkward>=2", "pyarrow>=12"]
test = ["pytest>=7", "fastjet>=3.4", "awkward>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashjet = ["_cpu_kernel.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* *-win* *-manylinux_i686"
test-command = "python {project}/tests/wheel_smoke.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["auto"]
